# Runs on every pull request. If any step fails, the PR shows a red ❌,
# so a broken package can't reach `main`, and from there npm.
name: CI

on:
  pull_request:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # tokens → ui → storybook + docs-site
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # publint and attw: is each package ready to publish?
      - name: Check packages
        run: pnpm -r check:package
